<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Website</title>
    <!-- 引入 Bootstrap 5 和 Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hero Section -->
    <header class="hero-section text-center d-flex align-items-center justify-content-center">
        <div class="container position-relative">
            <h1 class="display-1 fw-bold">Welcome to My World</h1>
            <p class="lead">A journey of creativity and inspiration.</p>
            <a href="#gallery" class="btn btn-outline-light btn-lg">Explore More</a>
        </div>
    </header>

    <!-- Gallery Section -->
    <section id="gallery" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4 fw-bold">Gallery</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card border-0">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Gallery Image">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Gallery Image">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Gallery Image">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="text-center py-3 bg-dark text-white">
        <p class="mb-0">© 2024 My Website. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
