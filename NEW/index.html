<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf-Inspired Template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">GolfLeFleur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section d-flex align-items-center text-center text-white position-relative">
        <img src="D:\GitHub\2024\NEW\pic\下載 (3).jpg" alt="Hero Image" class="w-100 h-100 position-absolute top-0 start-0" style="object-fit: cover; z-index: -1;">
        <a href="#shop" class="stretched-link w-100 h-100"></a>
        <div class="container position-relative">
            <h1 class="display-3 fw-bold">GOLFFFFFFFFFFFFFFF</h1>
            <p class="lead">KISS MY ASS</p>
            <header class="hero-section d-flex align-items-center text-center text-white position-relative">
                <a href="#shop" class="stretched-link w-100 h-100"></a>
                <div class="container position-relative">
                    <script>
                        // 添加視差滾動效果
                        document.addEventListener("scroll", () => {
                            const scrollY = window.scrollY; // 取得垂直滾動距離
                            const parallaxElements = document.querySelectorAll(".parallax-text");
                    
                            parallaxElements.forEach((el) => {
                                const speed = 0.3; // 視差速度調整
                                const offset = scrollY * speed;
                                el.style.transform = `translateY(${offset}px)`;
                            });
                        });
                    </script>
            </header>
            
        </div>
    </header>

    <!-- Featured Products -->
    <section id="shop" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4 fw-bold">Featured Products</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card product-card border-0">
                        <div class="product-image-wrapper"></div>
                        <img src="D:\GitHub\2024\NEW\pic\下載 (2).jpg" class="card-img-top" alt="Product 1">
                        <div class="card-body text-center">
                            <h5 class="card-title fw-bold">Product 1</h5>
                            <p class="card-text">KISS</p>
                            
                            
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card product-card border-0">
                        <img src="D:\GitHub\2024\NEW\pic\La fleur collection.jpg" class="card-img-top" alt="Product 2">
                        <div class="card-body text-center">
                            <h4 class="card-title fw-bold">Product 2</h4>
                            <p class="card-text">Unparalleled craftsmanship.</p>
                            
                          
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card product-card border-0">
                        <img src="D:\GitHub\2024\NEW\pic\Tyler, The Creator.jpg" class="card-img-top" alt="Product 3">
                        <div class="card-body text-center">
                            <h4 class="card-title fw-bold">Product 3</h4>
                            <p class="card-text">Designed for perfection.</p>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 GolfLeFleur. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
